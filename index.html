<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Submit Report / Feedback</title>
  <style>
    :root {
      --bg: #0b0b0b;
      --text: #f4f4f4;
      --muted: #bdbdbd;
      --line: #242424;
      --soft: #161616;
      --btn-hover: #2a2a2a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      padding: 40px 20px 64px;
      line-height: 1.75;
      font-size: 16px;
    }

    .wrap {
      width: min(720px, 100%);
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(2.2rem, 4.4vw, 3.6rem);
      line-height: 1.06;
      letter-spacing: -0.05em;
      font-weight: 800;
    }

    p.lead {
      color: var(--muted);
      font-size: 1.05rem;
      margin-bottom: 34px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 20px;
      background: var(--soft);
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    label {
      font-weight: 600;
      margin-bottom: 0.4rem;
      display: block;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .muted-text {
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: normal;
      margin-top: 4px;
      display: block;
    }

    .muted-text a {
      color: var(--text);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    input[type="text"],
    input[type="email"],
    input[type="url"],
    select,
    textarea {
      width: 100%;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
      font-family: inherit;
      transition: border-color 0.2s ease;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--muted);
    }

    textarea {
      min-height: 120px;
      resize: none;
      overflow-y: hidden;
      transition: height 0.2s ease;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      user-select: none;
      position: relative;
    }

    .checkbox-group input[type="checkbox"] {
      opacity: 0;
      position: absolute;
      height: 1.5rem;
      width: 1.5rem;
      z-index: 2;
      cursor: pointer;
    }

    .checkbox-custom {
      width: 1.5rem;
      height: 1.5rem;
      border-radius: 6px;
      background: var(--bg);
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      position: relative;
      flex-shrink: 0;
    }

    .checkbox-group input[type="checkbox"]:checked + .checkbox-custom {
      background: var(--text);
      border-color: var(--text);
    }

    .checkbox-group input[type="checkbox"]:checked + .checkbox-custom::after {
      content: "";
      width: 5px;
      height: 10px;
      border: solid var(--bg);
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
      position: absolute;
      top: 4px;
    }

    .checkbox-group label {
      font-weight: 500;
      cursor: pointer;
      margin: 0;
    }

    #identity {
      transition: all 0.3s ease;
      overflow: hidden;
    }

    #identity.hidden {
      max-height: 0;
      opacity: 0;
      pointer-events: none;
      margin-top: -20px;
    }

    .field-block {
      margin-bottom: 20px;
    }
    
    .field-block:last-child {
      margin-bottom: 0;
    }

    #anon-msg {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: -12px;
      margin-left: 36px;
      display: none;
    }

    button {
      background: var(--text);
      color: var(--bg);
      padding: 14px 24px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.1s ease;
      margin-top: 10px;
    }

    button:hover {
      opacity: 0.9;
    }
    
    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Success Message Styles */
    #success-message {
      text-align: center;
      padding: 60px 20px;
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 12px;
      display: none;
    }

    #success-message h2 {
      font-size: 1.8rem;
      margin: 20px 0 10px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    #success-message p {
      color: var(--muted);
      font-size: 1.1rem;
    }

    .success-icon {
      width: 64px;
      height: 64px;
      background: var(--line);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      color: var(--text);
    }

    /* Animations */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-in {
      animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @media (max-width: 780px) {
      body { padding: 28px 14px 52px; }
      form { padding: 20px; }
      h1 { letter-spacing: -0.04em; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Submit Report</h1>
    <p class="lead">Tell us about an issue you encountered or share your thoughts.</p>
    
    <div id="success-message">
      <div class="success-icon">
        <svg width="32" height="32" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <h2>Thanks for sharing</h2>
      <p>Your words matter to us.</p>
    </div>

    <form id="report-form" action="https://formspree.io/f/mwpqvkey" method="POST">
      
      <div class="checkbox-group">
        <input type="checkbox" id="anon" onchange="toggleAnon(this)">
        <span class="checkbox-custom"></span>
        <label for="anon">Send Anonymously</label>
      </div>
      <div id="anon-msg">We won’t / can't contact you</div>

      <div id="identity">
        <div class="field-block">
          <label for="name">Your Name</label>
          <input type="text" name="name" id="name" placeholder="Want to share your name?">
        </div>

        <div class="field-block">
          <label for="email">Your Email</label>
          <input type="email" name="email" id="email" placeholder="email@domain.com">
        </div>
      </div>

      <div class="field-block">
        <label for="product">Product</label>
        <select name="product" id="product">
          <option selected>Cool New Tab</option>
          <option>Better Messenger For Facebook™</option>
        </select>
      </div>

      <div class="field-block">
        <label for="screenshot">
          Provide a Screenshot
          <span class="muted-text">Please upload the image to sites like <a href="https://imgur.com/upload" target="_blank">imgur.com</a> or <a href="https://imgbb.com/" target="_blank">imgbb.com</a></span>
        </label>
        <input type="url" name="screenshot" id="screenshot" placeholder="https://imgur.com/example.jpg (optional)"/>
      </div>

      <div class="field-block">
        <label for="message">Report or Feedback</label>
        <textarea name="message" id="message" required placeholder="Tell us what happened or what you like about it ❣️✨..."></textarea>
      </div>
      
      <div class="checkbox-group">
        <input type="checkbox" id="includeUA" checked>
        <span class="checkbox-custom"></span>
        <label for="includeUA">Include browser info (helps us fix bugs)</label>
      </div>

      <input type="hidden" name="extras" id="extras" value="">
      <input type="hidden" name="anonymous" id="anonymous" value="false">

      <button type="submit" id="submit-btn">Send Report</button>
    </form>
  </main>

  <script>
    function toggleAnon(cb) {
      const identity = document.getElementById("identity");
      const msg = document.getElementById("anon-msg");
      const hide = cb.checked;
      identity.classList.toggle("hidden", hide);
      msg.style.display = hide ? 'block' : 'none';
      if(hide) {
        document.getElementById('name').value = '';
        document.getElementById('email').value = '';
      }
    }
    const textarea = document.getElementById('message');
    function adjustHeight(el) {
      el.style.height = 'auto'; 
      el.style.height = el.scrollHeight + 'px';
    }

    textarea.addEventListener('input', () => {
      adjustHeight(textarea);
    });
    window.addEventListener('load', () => adjustHeight(textarea));

    const form = document.getElementById('report-form');
    
    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const uaCheck = document.getElementById("includeUA");
      const extras = document.getElementById("extras");
      const msg = document.getElementById("message");
      const anonCheck = document.getElementById("anon");
      const anonInput = document.getElementById("anonymous");
      const btn = document.getElementById("submit-btn");

      if (msg.value.trim().length < 18) {
        alert("Please tell us a bit more about the issue or your feedback.");
        msg.focus();
        return;
      }
      
      anonInput.value = anonCheck.checked ? "true" : "false";
      extras.value = uaCheck.checked ? `Browser: ${navigator.userAgent}, Screen: ${window.innerWidth}x${window.innerHeight}` : '';
      const formData = new FormData(form);
      const originalBtnText = btn.innerText;
      btn.innerText = "Sending...";
      btn.disabled = true;

      try {
        const response = await fetch(form.action, {
          method: form.method,
          body: formData,
          headers: {
            'Accept': 'application/json'
          }
        });

        if (response.ok) {
          form.style.display = 'none';
          document.querySelector('p.lead').style.display = 'none';
          
          const successMsg = document.getElementById('success-message');
          successMsg.style.display = 'block';
          successMsg.classList.add('animate-in');
        } else {
          alert("Oops! There was a problem submitting your form.");
          btn.innerText = originalBtnText;
          btn.disabled = false;
        }
      } catch (error) {
        alert("Oops! There was a network error while submitting your form.");
        btn.innerText = originalBtnText;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
